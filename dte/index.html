<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DTE - Teste Simples</title>
  <link rel="stylesheet" href="../assets/css/hub-premium.css">
</head>
<body>
<div class="app">
  <div id="header"></div>
  <h1 style="color: white; text-align: center; padding: 40px;">TESTE: Se você vê isso, o HTML carrega!</h1>
  <div id="status" style="color: white; text-align: center; padding: 20px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="../assets/components/hub-utils.js"></script>
<script src="../assets/components/hub-layout.js"></script>

<script>
const DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRbfRYtnjYlxLIPTfIpC_Q7ftJ6uUf1BK9gcZs_CSEiEnIE7qCAk_U_3_bibXftsCAf5K1uQdAPsOx/pub?output=csv";

document.addEventListener("DOMContentLoaded", async () => {
  const status = document.getElementById("status");
  
  try {
    status.innerHTML = "🔄 Carregando header...";
    HUB.header.render("header", {
      systemLabel: "TESTE",
      title: "Diagnóstico de Carregamento",
      subtitle: "Verificando componentes"
    });
    
    status.innerHTML = "✅ Header OK<br>🔄 Carregando dados...";
    
    const res = await fetch(DATA_URL, { cache: "no-store" });
    const text = await res.text();
    const parsed = Papa.parse(text, { header: false });
    
    status.innerHTML = `✅ Header OK<br>✅ Dados OK (${parsed.data.length} linhas)<br><br>🎉 TUDO FUNCIONANDO!`;
    
  } catch (e) {
    status.innerHTML = `❌ ERRO: ${e.message}<br><br>Veja o console (F12)`;
    console.error(e);
  }
});
</script>
</body>
</html>
